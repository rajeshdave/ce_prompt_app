name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Inject Environment Variables
        run: |
          echo 'window.ENV = { FOLDER_URL: "${{ secrets.PROMPT_FOLDER_URL }}", API_URL: "${{ secrets.SCRIPT_API_URL }}" };' > env.js

      - name: Auto-Version Assets (Cache Busting)
        run: |
          sed -i 's/?v=1.0.0/?v=${{ github.run_id }}/g' index.html

      - name: Remove Gitignore for Deployment
        run: rm -f .gitignore

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
